<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="resource-title resource-desc">
  <title id="resource-title">Conceptual Gantt resource planning workspace</title>
  <desc id="resource-desc">A light product interface with a task, resource, role, and allocation grid beside a weekly timeline. Assignment initials appear on task bars, a compact team-load signal highlights one overload, a review suggestion keeps the decision with the team, and a release milestone closes the plan.</desc>

