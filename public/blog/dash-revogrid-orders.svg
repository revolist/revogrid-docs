    <rect x="910" y="395" width="74" height="29" rx="14" fill="#dff7e8"/><text x="947" y="416" text-anchor="middle" fill="#267a4a">Paid</text>
    <rect x="910" y="449" width="82" height="29" rx="14" fill="#fff0c8"/><text x="951" y="470" text-anchor="middle" fill="#9a6810">Open</text>
