  <text x="1150" y="523" class="cell">$245.00</text>
  <circle cx="1338" cy="541" r="6" fill="#5078f2"/>

  <rect x="375" y="733" width="1085" height="61" rx="15" fill="#20283a"/>
  <circle cx="408" cy="764" r="8" fill="#64d49a"/>
  <text x="432" y="772" fill="#d8e1f4" font-family="'SFMono-Regular', Consolas, monospace" font-size="19">Saved row 3: amount = 245.0</text>
  <rect x="1298" y="749" width="132" height="31" rx="15" fill="#2c374d"/>
  <text x="1364" y="771" text-anchor="middle" fill="#aebad0" font-size="15" font-weight="700">afteredit</text>
