<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RevoGrid order editor in a Dash application</title>
  <desc id="desc">A light-mode Dash application showing an editable virtualized order grid and a compact callback result after a cell change.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f7fc"/>
      <stop offset="1" stop-color="#eef2fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#7757e8"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#19233d" flood-opacity=".14"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #74809a; }
      .cell { fill: #2b354d; font-size: 21px; }
      .head { fill: #68748d; font-size: 17px; font-weight: 750; letter-spacing: .055em; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#page)"/>
