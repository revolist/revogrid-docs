<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">RevoGrid cell edit callback flow in Dash</title>
  <desc id="desc">A cell edit in the browser creates a compact afteredit event, which a Dash callback can validate and save without transferring the complete dataset.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f5f1ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#243b72" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6d74e8"/>
    </marker>
  </defs>
  <rect width="1440" height="520" rx="28" fill="url(#bg)"/>
  <text x="720" y="74" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#17213a">One edit, one compact event</text>
  <text x="720" y="112" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#64708b">Keep the full dataset in place while Python receives only what changed</text>

  <g filter="url(#shadow)">
    <rect x="80" y="178" width="300" height="220" rx="20" fill="#fff" stroke="#dfe6f4"/>
    <rect x="80" y="178" width="300" height="52" rx="20" fill="#2457e6"/>
    <path d="M80 210h300v20H80z" fill="#2457e6"/>
    <text x="106" y="211" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">Browser grid</text>
    <path d="M105 260h250M105 304h250M105 348h250M188 236v138M278 236v138" stroke="#e3e8f2"/>
    <rect x="188" y="304" width="90" height="44" fill="#e9efff" stroke="#2457e6" stroke-width="2"/>
    <text x="233" y="332" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#2457e6">140</text>
    <text x="146" y="287" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#606b83">A-100</text>
    <text x="233" y="287" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#606b83">Amount</text>
    <text x="316" y="287" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#606b83">Open</text>
  </g>

  <path d="M400 288h118" stroke="#6d74e8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="459" y="267" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#525ccf">afteredit</text>

  <g filter="url(#shadow)">
    <rect x="540" y="178" width="360" height="220" rx="20" fill="#111d3d"/>
    <text x="570" y="218" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" fill="#9db5ff">{</text>
    <text x="590" y="252" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" fill="#a9b8dd">"rowIndex": <tspan fill="#ffd66b">0</tspan>,</text>
    <text x="590" y="286" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" fill="#a9b8dd">"prop": <tspan fill="#70e2b6">"amount"</tspan>,</text>
    <text x="590" y="320" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" fill="#a9b8dd">"val": <tspan fill="#ffd66b">140</tspan></text>
    <text x="570" y="354" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" fill="#9db5ff">}</text>
    <rect x="570" y="366" width="210" height="8" rx="4" fill="#29385f"/>
    <rect x="570" y="366" width="54" height="8" rx="4" fill="#6d74e8"/>
  </g>

  <path d="M920 288h118" stroke="#6d74e8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="979" y="267" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#525ccf">callback</text>

  <g filter="url(#shadow)">
    <rect x="1060" y="178" width="300" height="220" rx="20" fill="#fff" stroke="#dfe6f4"/>
    <circle cx="1110" cy="233" r="22" fill="#eaf8f2"/>
    <path d="M1099 233l8 8 15-17" fill="none" stroke="#21a46b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1146" y="240" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#17213a">Python handles it</text>
    <text x="1100" y="290" font-family="Inter,Arial,sans-serif" font-size="17" fill="#606b83">Validate the value</text>
    <text x="1100" y="329" font-family="Inter,Arial,sans-serif" font-size="17" fill="#606b83">Update a database</text>
    <text x="1100" y="368" font-family="Inter,Arial,sans-serif" font-size="17" fill="#606b83">Refresh related UI</text>
  </g>

  <text x="720" y="464" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#34405c">No full-source round trip required</text>
</svg>
